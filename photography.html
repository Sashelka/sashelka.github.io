<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photography | SASHELKA</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #070707;
  --text: #f4f0e8;
  --muted: #aaa39a;
  --line: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: Manrope, sans-serif;
  background: #070707;
  color: var(--text);
}

.container {
  width: min(92%, 1360px);
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top:0;
  background: rgba(7,7,7,0.9);
  border-bottom:1px solid var(--line);
}

.header-inner {
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand {
  letter-spacing:0.3em;
  font-size:14px;
}

.nav {
  display:flex;
  gap:20px;
}

.nav a {
  font-size:12px;
  color:#aaa;
}

.gallery-page {
  padding:60px 0 120px;
}

.gallery-layout {
  display:flex;
  flex-direction:column;
  gap:18px;
}

.gallery-row {
  display:grid;
  gap:18px;
}

/* LAYOUT */

.row-hero { grid-template-columns: 1.3fr 1fr; }
.stack { display:grid; gap:18px; }

.row-triptych { grid-template-columns: 1fr 1fr 1fr; }
.row-double { grid-template-columns: 1fr 1fr; }
.row-narrative { grid-template-columns: 0.9fr 1.2fr 0.9fr; }
.row-wide { grid-template-columns: 1fr; }

/* CARDS */

.art-card {
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.art-card img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.4s;
}

.art-card:hover img {
  transform:scale(1.03);
}

/* RATIOS */

.card-portrait img { aspect-ratio: 0.8/1; }
.card-square img { aspect-ratio: 1/1; }
.card-tall img { aspect-ratio: 0.7/1; }
.card-wide img { aspect-ratio: 2.2/1; }

/* MOBILE */

@media(max-width:1000px){
  .row-hero,
  .row-triptych,
  .row-double,
  .row-narrative {
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

    <div class="nav">

</div>

</body>
</html>
